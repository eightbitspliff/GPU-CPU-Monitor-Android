name: Build PC Monitor

on:
  push:
    paths:
      - "android-app/**"
      - "pc-server/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk ../PCMonitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitor-apk
          path: PCMonitor.apk

  windows-server:
    name: Windows-Server (EXE)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pyinstaller
      - name: EXE bauen
        run: |
          python make_icon.py
          pyinstaller --onefile --noconsole --name PCMonitorServer --icon icon.ico `
            --hidden-import pynvml --hidden-import pystray._win32 pc_monitor_server.py
      - name: EXE testen (startet im Tray, liefert Werte)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PCMonitorServer.exe -ArgumentList "--tray" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { throw "EXE hat sich beendet (Exitcode $($p.ExitCode))" }
            try {
              $r = Invoke-RestMethod http://127.0.0.1:47811/stats -TimeoutSec 3
              Write-Host "CPU $($r.cpu.usage) %  RAM $($r.ram.usage) %  GPU-Quelle $($r.gpu_source)"
              $ok = $true; break
            } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "Server hat nicht geantwortet" }
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitorServer-exe
          path: pc-server/dist/PCMonitorServer.exe

  release:
    name: Download-Seite (Release)
    needs: [android, windows-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-monitor-${{ github.run_number }}
          name: PC Monitor (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            **PCMonitor.apk** – auf dem Android-Handy installieren.
            **PCMonitorServer.exe** – auf dem Windows-PC starten.
          files: |
            PCMonitor.apk
            PCMonitorServer.exe
