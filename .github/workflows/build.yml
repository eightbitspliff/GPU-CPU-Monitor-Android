name: Build PC Monitor

on:
  push:
    paths:
      - "android-app/**"
      - "pc-server/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk ../PCMonitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitor-apk
          path: PCMonitor.apk

  windows-server:
    name: Windows-Server (EXE)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pyinstaller
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Sensor-Modul bauen (LibreHardwareMonitorLib)
        run: |
          dotnet publish sensor_helper/SensorHelper.csproj -c Release -o sensor_helper/out
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem sensor_helper/out | Select-Object Name, Length | Format-Table -AutoSize
      - name: Treiber-Installer PawnIO holen
        run: |
          Invoke-WebRequest https://github.com/namazso/PawnIO.Setup/releases/latest/download/PawnIO_setup.exe -OutFile PawnIO_setup.exe
          (Get-Item PawnIO_setup.exe).Length
      - name: PresentMon holen (FPS-Messung, Intel, MIT-Lizenz)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "pcmon-ci" }
          $rels = Invoke-RestMethod https://api.github.com/repos/GameTechDev/PresentMon/releases -Headers $h
          $asset = $null
          foreach ($r in $rels) {
            $asset = $r.assets | Where-Object { $_.name -match '^PresentMon-[\d.]+-x64\.exe$' } | Select-Object -First 1
            if ($asset) { Write-Host "PresentMon: $($r.tag_name) / $($asset.name)"; break }
          }
          if (-not $asset) { $rels[0].assets | ForEach-Object { Write-Host $_.name }; throw "PresentMon-Konsolenprogramm nicht gefunden" }
          Invoke-WebRequest $asset.browser_download_url -OutFile PresentMon.exe
          (Get-Item PresentMon.exe).Length
      - name: Sensor-Modul testen
        shell: pwsh
        run: |
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo.FileName = (Resolve-Path sensor_helper/out/SensorHelper.exe).Path
          $p.StartInfo.UseShellExecute = $false
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.RedirectStandardError = $true
          $p.StartInfo.RedirectStandardInput = $true
          [void]$p.Start()
          $lines = @()
          for ($i = 0; $i -lt 3; $i++) { $p.StandardInput.WriteLine(""); $lines += $p.StandardOutput.ReadLine() }
          $p.Kill()
          $lines | ForEach-Object { Write-Host $_ }
          Write-Host "stderr: $($p.StandardError.ReadToEnd())"
          $j = $lines[-1] | ConvertFrom-Json
          if ($j.error) { throw "Sensor-Modul meldet Fehler: $($j.error)" }
          if ($null -eq $j.admin) { throw "Sensor-Modul liefert keine Daten" }
      - name: EXE bauen
        run: |
          python make_icon.py
          if ($LASTEXITCODE) { exit 1 }
          pyinstaller --onefile --noconsole --uac-admin --name PCMonitorServer --icon icon.ico `
            --hidden-import pynvml --hidden-import pystray._win32 `
            --add-data "sensor_helper/out;sensor_helper" --add-data "PawnIO_setup.exe;." --add-data "PresentMon.exe;." `
            --collect-submodules pychromecast --collect-submodules zeroconf pc_monitor_server.py
      - name: EXE testen (startet im Tray, liefert Werte)
        shell: pwsh
        run: |
          # verwaistes Skript einer alten Version nachstellen – die EXE muss es beenden
          $old = Start-Process powershell -ArgumentList "-NoProfile", "-Command", "while (`$true) { `$x = 'GPUPerformanceCounters_GPUEngine'; Start-Sleep 1 }" -PassThru -WindowStyle Hidden
          $p = Start-Process -FilePath dist\PCMonitorServer.exe -ArgumentList "--tray" -PassThru
          $r = $null
          for ($i = 0; $i -lt 30 -and -not $r; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { throw "EXE hat sich beendet (Exitcode $($p.ExitCode))" }
            try { $r = Invoke-RestMethod http://127.0.0.1:47811/stats -TimeoutSec 3 } catch { }
          }
          try {
            if (-not $r) { throw "Server hat nicht geantwortet" }
            $old.Refresh()
            if (-not $old.HasExited) { throw "Altes Hintergrundskript wurde nicht beendet" }
            Write-Host "Altes Hintergrundskript beendet: ja"
            Write-Host "CPU $($r.cpu.usage) %  RAM $($r.ram.usage) %  GPU-Quelle $($r.gpu_source)"
            Write-Host "Kerne: $($r.cpu.cores.Count)  CPU-Temp: $($r.cpu.temp_c)  CPU-Leistung: $($r.cpu.power_w) W"
            Write-Host "Temp-Hinweis: $($r.cpu.temp_note)  GPUs: $($r.gpus | ConvertTo-Json -Compress)"
            Start-Sleep -Seconds 3
            $r2 = Invoke-RestMethod http://127.0.0.1:47811/stats -TimeoutSec 3
            Write-Host "Nach 3 s: CPU $($r2.cpu.usage) %  GPU $($r2.gpus[0].usage) %"
            $pm = Get-Process PresentMon -ErrorAction SilentlyContinue
            Write-Host "FPS: $($r2.fps | ConvertTo-Json -Compress)  PresentMon läuft: $([bool]$pm)"
            if (-not $pm) { throw "PresentMon (FPS-Messung) läuft nicht" }
            # Auf dem Test-Rechner zeichnet das Terminal Bilder -> es muss ein FPS-Wert kommen
            $fpsOk = $false
            for ($k = 0; $k -lt 8 -and -not $fpsOk; $k++) {
              Start-Sleep -Seconds 1
              $r3 = Invoke-RestMethod http://127.0.0.1:47811/stats -TimeoutSec 3
              if ($r3.fps) { $fpsOk = $true; Write-Host "FPS-Wert: $($r3.fps.fps) ($($r3.fps.app))" }
            }
            if (-not $fpsOk) { throw "Keine FPS gemessen" }
            Write-Host "Priorität: $((Get-Process -Id $p.Id).PriorityClass)  Sensor-Modul: $((Get-Process SensorHelper -ErrorAction SilentlyContinue | Select-Object -First 1).PriorityClass)"
            if ($r.cpu.temp_note -eq "Sensor-Modul fehlt im PC-Server") { throw $r.cpu.temp_note }
            if (-not $r.cpu.cores) { throw "Auslastung je CPU-Kern fehlt" }
            $html = Invoke-WebRequest http://127.0.0.1:47811/ -UseBasicParsing -TimeoutSec 5
            if ($html.Content -notmatch "PC Monitor") { throw "Dashboard fehlt" }
            $c = Invoke-RestMethod "http://127.0.0.1:47811/cast?scan=1" -TimeoutSec 30
            Write-Host "Cast verfügbar: $($c.available)  Geräte: $($c.devices.Count)  $($c.error)"
            if (-not $c.available) { throw "Cast-Unterstützung fehlt in der EXE" }
          } finally {
            # Server hart beenden (wie "Task beenden"): das Sensor-Modul muss mit enden
            Stop-Process -Name PCMonitorServer -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          $left = Get-Process SensorHelper, PresentMon -ErrorAction SilentlyContinue
          if ($left) { throw "Hilfsprozess läuft nach dem Beenden des Servers weiter: $($left.Name -join ', ')" }
          Write-Host "Nach dem Beenden läuft kein Hilfsprozess mehr: ja"
      - name: CPU-Verbrauch messen (30 s, Abfrage jede Sekunde wie App/Nest Hub)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PCMonitorServer.exe -ArgumentList "--tray" -PassThru
          for ($i = 0; $i -lt 20; $i++) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:47811/stats -TimeoutSec 2 | Out-Null; break } catch { } }
          Start-Sleep 3
          function T($name) { ($(Get-Process $name -ErrorAction SilentlyContinue) | Measure-Object -Property TotalProcessorTime -Sum).Sum }
          function cpu($n) { $x = Get-Process $n -ErrorAction SilentlyContinue; if ($x) { ($x | ForEach-Object { $_.TotalProcessorTime.TotalMilliseconds } | Measure-Object -Sum).Sum } else { 0 } }
          $names = "PCMonitorServer", "SensorHelper", "WmiPrvSE", "powershell"
          $before = @{}; foreach ($n in $names) { $before[$n] = cpu $n }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt 30; $i++) { try { Invoke-RestMethod http://127.0.0.1:47811/stats -TimeoutSec 2 | Out-Null } catch { }; Start-Sleep -Milliseconds 1000 }
          $sec = $sw.Elapsed.TotalSeconds
          foreach ($n in $names) {
            $ms = (cpu $n) - $before[$n]
            Write-Host ("{0,-16} {1,8:N0} ms CPU in {2:N0} s  = {3:N2} % eines Kerns" -f $n, $ms, $sec, ($ms / $sec / 10))
          }
          Stop-Process -Id $p.Id -Force
          Get-Process SensorHelper -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: PawnIO-Installation testen (Treiber für CPU-Temperatur)
        continue-on-error: true
        shell: pwsh
        run: |
          $i = Start-Process -FilePath .\PawnIO_setup.exe -ArgumentList "-install","-silent" -Wait -PassThru
          Write-Host "PawnIO-Setup Exitcode: $($i.ExitCode)"
          if (-not (Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO")) { throw "PawnIO nicht installiert" }
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo.FileName = (Resolve-Path sensor_helper/out/SensorHelper.exe).Path
          $p.StartInfo.UseShellExecute = $false
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.RedirectStandardInput = $true
          [void]$p.Start()
          $l = @(); for ($k = 0; $k -lt 3; $k++) { $p.StandardInput.WriteLine(""); $l += $p.StandardOutput.ReadLine() }
          $p.Kill()
          Write-Host "Mit PawnIO: $($l[-1])"
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitorServer-exe
          path: pc-server/dist/PCMonitorServer.exe

  release:
    name: Download-Seite (Release)
    needs: [android, windows-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-monitor-${{ github.run_number }}
          name: PC Monitor (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            **PCMonitor.apk** – auf dem Android-Handy installieren.
            **PCMonitorServer.exe** – auf dem Windows-PC starten.
          files: |
            PCMonitor.apk
            PCMonitorServer.exe
