name: Build PC Monitor

on:
  push:
    paths:
      - "android-app/**"
      - "pc-server/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk ../PCMonitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitor-apk
          path: PCMonitor.apk

  windows-server:
    name: Windows-Server (EXE)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pyinstaller
      - name: EXE bauen
        run: |
          python make_icon.py
          if ($LASTEXITCODE) { exit 1 }
          pyinstaller --onefile --noconsole --name PCMonitorServer --icon icon.ico `
            --hidden-import pynvml --hidden-import pystray._win32 `
            --collect-submodules pychromecast --collect-submodules zeroconf pc_monitor_server.py
      - name: EXE testen (startet im Tray, liefert Werte)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PCMonitorServer.exe -ArgumentList "--tray" -PassThru
          $r = $null
          for ($i = 0; $i -lt 30 -and -not $r; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { throw "EXE hat sich beendet (Exitcode $($p.ExitCode))" }
            try { $r = Invoke-RestMethod http://127.0.0.1:47811/stats -TimeoutSec 3 } catch { }
          }
          try {
            if (-not $r) { throw "Server hat nicht geantwortet" }
            Write-Host "CPU $($r.cpu.usage) %  RAM $($r.ram.usage) %  GPU-Quelle $($r.gpu_source)"
            # CPU-Sensor-Skript (PowerShell) muss laufen und Werte melden
            for ($i = 0; $i -lt 15 -and -not $r.cpu_sensor_running; $i++) {
              Start-Sleep -Seconds 2
              $r = Invoke-RestMethod http://127.0.0.1:47811/stats -TimeoutSec 3
            }
            Write-Host "CPU-Sensoren: läuft=$($r.cpu_sensor_running) Quelle=$($r.cpu_sensor_source) Power=$($r.cpu.power_w) Temp=$($r.cpu.temp_c)"
            if (-not $r.cpu_sensor_running) { throw "CPU-Sensor-Skript meldet sich nicht" }
            $h = Invoke-RestMethod http://127.0.0.1:47811/history -TimeoutSec 5
            if ($h.cpu.Count -lt 1) { throw "Verlauf fehlt" }
            $html = Invoke-WebRequest http://127.0.0.1:47811/ -UseBasicParsing -TimeoutSec 5
            if ($html.Content -notmatch "PC Monitor") { throw "Dashboard fehlt" }
            $c = Invoke-RestMethod "http://127.0.0.1:47811/cast?scan=1" -TimeoutSec 30
            Write-Host "Cast verfügbar: $($c.available)  Geräte: $($c.devices.Count)  $($c.error)"
            if (-not $c.available) { throw "Cast-Unterstützung fehlt in der EXE" }
            $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name PCMonitorServer -ErrorAction SilentlyContinue).PCMonitorServer
            Write-Host "Autostart-Eintrag: $run"
            if ($run -notmatch "PCMonitorServer\.exe`" --tray$") { throw "Autostart-Eintrag fehlt oder falsch" }
          } finally {
            Stop-Process -Id $p.Id -Force
            Remove-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name PCMonitorServer -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitorServer-exe
          path: pc-server/dist/PCMonitorServer.exe

  release:
    name: Download-Seite (Release)
    needs: [android, windows-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-monitor-${{ github.run_number }}
          name: PC Monitor (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            **PCMonitor.apk** – auf dem Android-Handy installieren.
            **PCMonitorServer.exe** – auf dem Windows-PC starten.
          files: |
            PCMonitor.apk
            PCMonitorServer.exe
