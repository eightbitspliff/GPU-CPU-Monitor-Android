name: Build PC Monitor

on:
  push:
    paths:
      - "android-app/**"
      - "pc-server/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk ../PCMonitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitor-apk
          path: PCMonitor.apk

  windows-server:
    name: Windows-Server (EXE)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pyinstaller
      - name: EXE bauen
        run: pyinstaller --onefile --name PCMonitorServer --hidden-import pynvml pc_monitor_server.py
      - uses: actions/upload-artifact@v4
        with:
          name: PCMonitorServer-exe
          path: pc-server/dist/PCMonitorServer.exe

  release:
    name: Download-Seite (Release)
    needs: [android, windows-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-monitor-${{ github.run_number }}
          name: PC Monitor (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            **PCMonitor.apk** – auf dem Android-Handy installieren.
            **PCMonitorServer.exe** – auf dem Windows-PC starten.
          files: |
            PCMonitor.apk
            PCMonitorServer.exe
